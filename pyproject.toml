[project]
name = "openai-research-bot"
version = "0.1.0"
description = "Multi-agent research bot using the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.17.0,<1",
    "anthropic>=0.52.0",
    "rich>=13.0.0,<16",
    "elasticdash-sdk",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
